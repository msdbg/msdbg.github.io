name: build-seo
on:
  push:
    branches: [main]
    paths: ['posts/**', 'posts.json', 'build_seo.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install markdown-it-py
      - run: python build_seo.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(seo): rebuild mirrors + sitemap'
